<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体（按需，系统字体时省略；只能用 Google 字体，CSS 地址前缀：https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google） -->
  <!-- <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/> -->

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #F59E0B;
      --color-primary-container:    #FEF3C7;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（M3 色调系统 + Apple HIG 呼吸感） === */
      /* 移动端用背景色层级区分区域（比 shadow 更轻盈），
         相邻层级之间应有肉眼可感知但不突兀的明度差。
         ⚠️ surface-container 是 Tonal Fill（输入框/搜索框背景色）的关键层，
         它必须与 background 有可感知的色差，否则输入框会"看不见"。
         ⚠️ surface 色阶必须保持中性色调，不要把 primary 的色相混入
         surface 系统。色彩氛围通过 primary、装饰元素传达，surface 只管层级 */
      --color-background:                 #FAFAF8;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FAFAF8;
      --color-surface-container:          #F5F5F0;
      --color-surface-container-high:     #EBEBE4;
      --color-surface-container-highest:  #E0E0D8;
      /* === 文字 === */
      --color-on-surface:           #1C1917;
      --color-on-surface-variant:   #57534E;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #A8A29E;
      --color-outline-variant:  #D6D3D1;
      /* === 圆角 === */
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.5rem;
      --radius-2xl:  2rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 4px 12px rgba(245, 158, 11, 0.15);
      --shadow-float:  0 10px 25px rgba(245, 158, 11, 0.2);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.15);
      /* === 字体 === */
      /* 正文字体只能使用 system-ui 或常规字体（Noto Sans SC / Noto Serif SC 等）。
         创意展示体（ZCOOL 系列）和书法手写体（Ma Shan Zheng 等）仅限标题或装饰用途，
         禁止用作 --font-sans 全局正文字体 */
      --font-sans: system-ui, -apple-system, "Noto Sans SC", sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段（从 @nav:start 到 @nav:end） -->
  <header class="sticky top-0 z-30 bg-surface-container-lowest border-b border-outline-variant">
    <div class="flex items-center justify-between px-5 h-14">
      <div class="flex items-center gap-3">
        <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container">
          <i data-lucide="arrow-left" class="w-5 h-5 text-on-surface-variant"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);">
            <i data-lucide="dices" class="w-5 h-5 text-white"></i>
          </div>
          <h1 class="text-xl font-bold text-on-surface">骰子</h1>
        </div>
      </div>
      <button id="settings-btn" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container">
        <i data-lucide="settings" class="w-5 h-5 text-on-surface-variant"></i>
      </button>
    </div>
  </header>
  <!-- @nav:end 导航组件，不需要的页面则不要复制此段 -->

  <main class="flex-1">
    <!-- @main-content:start -->
    <!-- @main-content:end -->
  </main>

  <script>lucide.createIcons();</script>
</body>

</html>
